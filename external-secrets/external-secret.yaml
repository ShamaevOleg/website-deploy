apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-password
  namespace: remni-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: rds-password # k8s Secret name
  data:
    - secretKey: POSTGRES_PASSWORD # key in k8s Secret
      remoteRef:
        key: "rds!db-510adc67-2bf2-4095-9700-1cad63fb0df8" # name of the secret in SM
        property: password # extract password field from JSON
