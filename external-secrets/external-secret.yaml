apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-password
  namespace: remni-backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: rds-password # имя k8s Secret, который создастся
  data:
    - secretKey: POSTGRES_PASSWORD # ключ в k8s Secret
      remoteRef:
        key: "rds!db-ab66382f-65f5-4f4b-a76b-238ae09d476c" # имя секрета в SM
        property: password # ← извлечь поле password из JSON
