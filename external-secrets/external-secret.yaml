apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-password
  namespace: remni-website
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: rds-password # k8s Secret name
  data:
    - secretKey: POSTGRES_PASSWORD # key in k8s Secret
      remoteRef:
        key: "rds!db-4a58a347-8adf-41eb-ac43-d8342b862535" # name of the secret in SM
        property: password # extract password field from JSON
